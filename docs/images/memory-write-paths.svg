<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">写入路径对比：平台内置记忆与 OMNA</title>
<desc id="desc">平台内置记忆由模型自动判断并直接生效，用户事后查看或删除，且只在本平台使用。OMNA 中，对话、导入或 Agent 提议先形成候选，用户确认后才成为正式记忆，之后按连接和类别授权返回给 Agent，并记录每次返回的内容。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.6"/></marker>
 <style>text{font-family:Segoe UI,Microsoft YaHei,PingFang SC,sans-serif;fill:#20252c}.lane{font-size:18px;font-weight:650}.main{font-size:17px;font-weight:600}.main2{font-size:16px;font-weight:600}.sub{font-size:14px;fill:#647080}.sub2{font-size:13px;fill:#647080}.box{fill:#fff;stroke:#dce1e7;stroke-width:1.2}.line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}.mark{font-size:14px;fill:#252a32}</style>
</defs>
<rect width="1200" height="610" rx="24" fill="#ffffff"/>
<text x="52" y="59" font-size="30" font-weight="700">写入路径对比：OMNA 多了两道关</text>
<text x="52" y="91" font-size="18" fill="#647080">平台记忆追求省事；OMNA 让你决定记什么、给谁看。</text>

<!-- 平台内置记忆 -->
<rect x="24" y="118" width="1152" height="170" rx="18" fill="#f5f6f8"/>
<text x="45" y="150" class="lane">平台内置记忆</text>
<text x="170" y="150" class="sub">以 ChatGPT、豆包为例</text>

<rect x="45" y="170" width="250" height="96" rx="14" class="box"/>
<text x="65" y="210" class="main">你在对话里说了一句话</text>
<text x="65" y="238" class="sub">如“最近准备转 AI 产品”</text>
<path d="M295 218H323" class="line"/>
<rect x="331" y="170" width="250" height="96" rx="14" class="box"/>
<text x="351" y="210" class="main">模型自动判断要不要记</text>
<text x="351" y="238" class="sub">默认不需要你确认</text>
<path d="M581 218H609" class="line"/>
<rect x="617" y="170" width="250" height="96" rx="14" class="box"/>
<text x="637" y="210" class="main">在本平台后续回答中生效</text>
<text x="637" y="238" class="sub">换一个 AI 就用不上</text>
<path d="M867 218H895" class="line"/>
<rect x="903" y="170" width="250" height="96" rx="14" class="box"/>
<text x="923" y="210" class="main">发现不对，再去设置里改</text>
<text x="923" y="238" class="sub">查看、纠正或删除</text>

<!-- OMNA -->
<rect x="24" y="306" width="1152" height="214" rx="18" fill="#f5f6f8"/>
<text x="45" y="338" class="lane">OMNA</text>

<rect x="45" y="356" width="160" height="96" rx="14" class="box"/>
<text x="61" y="396" class="main2">对话、导入</text>
<text x="61" y="424" class="sub2">或 Agent 提议</text>
<path d="M205 404H227" class="line"/>
<rect x="235" y="356" width="160" height="96" rx="14" class="box"/>
<text x="251" y="396" class="main2">提取候选</text>
<text x="251" y="424" class="sub2">附原文依据</text>
<path d="M395 404H417" class="line"/>
<rect x="425" y="356" width="160" height="96" rx="14" fill="#252a32"/>
<text x="441" y="396" class="main2" style="fill:#fff">待确认</text>
<text x="441" y="424" class="sub2" style="fill:#ccd2dc">批准、修改或拒绝</text>
<path d="M585 404H607" class="line"/>
<rect x="615" y="356" width="160" height="96" rx="14" class="box"/>
<text x="631" y="396" class="main2">正式记忆</text>
<text x="631" y="424" class="sub2">有版本、有来源</text>
<path d="M775 404H797" class="line"/>
<rect x="805" y="356" width="160" height="96" rx="14" fill="#252a32"/>
<text x="821" y="396" class="main2" style="fill:#fff">按授权返回</text>
<text x="821" y="424" class="sub2" style="fill:#ccd2dc">按连接和类别过滤</text>
<path d="M965 404H987" class="line"/>
<rect x="995" y="356" width="160" height="96" rx="14" class="box"/>
<text x="1011" y="396" class="main2">访问记录</text>
<text x="1011" y="424" class="sub2">谁拿到了哪几句</text>

<path d="M505 452V466M885 452V466" fill="none" stroke="#252a32" stroke-width="1.4"/>
<text x="505" y="488" text-anchor="middle" class="mark">拒绝的内容不进入检索</text>
<text x="885" y="488" text-anchor="middle" class="mark">默认只开放少数类别</text>

<text x="52" y="558" font-size="15">代价：导入和 Agent 提议都要你处理。普通新增点一下即可确认，修改、相似或缺少依据的才需要展开选择。</text>
<text x="52" y="586" font-size="14" fill="#647080">依据各产品公开文档与 OMNA 的 PRODUCT.md 整理。</text>
</svg>
