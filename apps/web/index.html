<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知我</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem("zhiwo.theme") || "")
        if (theme.mode === "dark") document.documentElement.dataset.mode = "dark"
        if (theme.accent === "blue" || theme.accent === "green" || theme.accent === "violet") document.documentElement.dataset.accent = theme.accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
